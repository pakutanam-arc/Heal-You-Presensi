[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# SPA Routing Redirects (for ?portal=peserta, ?verify_cert=, ?ticket=, and direct paths)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & Feature Headers (allow Google Auth Popup & Camera QR Scanner on Netlify)
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Permissions-Policy = "camera=(self), microphone=()"
